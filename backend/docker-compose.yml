services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lapagent-backend
    ports:
      - "8000:8000"
    environment:
      LAPAGENT_REDIS_URL: redis://redis:6379/0
      LAPAGENT_SEARXNG_URL: http://web:8080
    depends_on:
      - redis
      - web
    volumes:
      - .:/app
      - ../logs:/logs
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped


  redis:
    image: redis:latest
    container_name: lapagent-redis
    restart: unless-stopped

  web:
    image: searxng/searxng:latest
    container_name: lapagent-web
    ports:
      - "8080:8080"
    volumes:
      - ./Webcrawl/setting.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped